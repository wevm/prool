name: Main
on:
  push:
    branches: [main, jxom/base-localnet]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  changesets:
    name: Changesets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          publish: pnpm run changeset:publish
          version: pnpm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-images:
    name: Release images
    needs: verify
    # Bootstrap the first image from this branch before verification can pull it.
    if: ${{ !cancelled() && (github.ref == 'refs/heads/jxom/base-localnet' || needs.verify.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Read image configuration
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          source docker/base/config.env
          echo "BASE_REVISION=$BASE_REVISION" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/prool-base-localnet:sha-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.RELEASE_IMAGE }}
          build-contexts: base-source=https://github.com/base/base.git#${{ env.BASE_REVISION }}
          build-args: BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,scope=base-amd64,mode=min

      - name: Summarize release
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Published \`$RELEASE_IMAGE\` for \`linux/amd64\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$IMAGE_DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
